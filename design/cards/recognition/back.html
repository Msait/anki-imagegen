<div class="aic aic--recognition">
  <span class="aic-chip">{{Subdeck}}</span>
  <div class="aic-q">
    <div class="aic-answer">
      <h1 class="aic-term aic-term--sm">{{Word}}</h1>
      {{tts en_US:Word}}
    </div>
    {{#IPA}}<span class="aic-ipa">{{IPA}}</span>{{/IPA}}
  </div>
  <hr id="answer">
  <div class="aic-a">
    <span class="aic-label">Meaning</span>
    <div class="aic-meaning">{{Meaning}}</div>
    {{#Example}}<div class="aic-example">{{Example}}</div>{{/Example}}
  </div>
  {{#Image}}<div class="aic-image">{{Image}}</div>{{/Image}}
</div>
