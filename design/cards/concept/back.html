<div class="aic aic--swe">
  <span class="aic-chip">SWE{{#Topic}} · {{Topic}}{{/Topic}}</span>
  <h1 class="aic-term aic-term--sm">{{Term}}</h1>
  <hr id="answer">
  {{#Image}}<div class="aic-image">{{Image}}</div>{{/Image}}
  <div class="aic-a">
    <span class="aic-label">Explanation</span>
    <div class="aic-meaning">{{Explanation}}</div>
    {{#Code}}<pre class="aic-code"><code>{{Code}}</code></pre>{{/Code}}
  </div>
</div>
