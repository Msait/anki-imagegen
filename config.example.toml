# [generator] is read once when the MCP server starts: restart Claude Code after changing it.
# Everything else is re-read on every get_config call.
[generator]
model = "z-image-turbo"       # z-image-turbo | flux2-klein-4b | flux-schnell
quantize = 4                  # ignored by pre-quantized models
steps = 9
width = 768
height = 768

[defaults]
style = "Japanese anime illustration in the style of a slice-of-life anime, 2D cel shading, clean thin lineart, soft warm palette, expressive characters. NOT Western cartoon, NOT Pixar, NOT 3D render"
term_field = "Front"           # what the card is about
meaning_field = "Back"         # what it means (HTML stripped)
image_field = "Back"
placement = "append"           # append | prepend | replace
skip_if_has_image = true
batch_size = 10
card_kind = "auto"             # auto | word | concept
caption = ""                   # banner template with {term}; "" = no text on the image
constraints = "NOT Western cartoon, NOT Pixar, NOT 3D render, NOT chibi. No text in the image"
prompt_guide = ""              # markdown with scene-writing rules, relative to this file

# Claude fills {term} and {meaning} with English visual scene descriptions, never the
# foreign word itself (models draw quoted words as text).
[prompt_rules]
word = "{term}, one clear scene, centered composition"
concept = "a visual metaphor scene: {meaning}"

# Per-deck overrides: any [defaults] key; subdecks (A::B) inherit A's overrides.
# The decks below match the three card designs in design/cards: rename them to your decks.

# design/cards/chunk: situation on the front, the chunk on a banner in the picture on the back
[decks."English::CHUNKS"]
style = "Japanese anime illustration in the style of a light novel cover, 2D cel shading, clean thin lineart, large expressive eyes, soft glowing light, highly detailed digital painting, cinematic golden-hour backlight, glowing rim light on hair, floating light particles, soft bokeh background, rich warm saturated colors, glossy hair highlights, sparkling detailed eyes"
term_field = "Chunk"
meaning_field = "Situation"    # draw the situation from the card front
image_field = "Image"
placement = "replace"
card_kind = "concept"
constraints = "NOT Western cartoon, NOT Pixar, NOT 3D render, NOT chibi. No other text in the image"
caption = 'Bold text on a yellow brush-stroke banner at the bottom: "{term}"'
prompt_guide = "prompt_guides/example.md"

# design/cards/recognition: word on the front; meaning, example, then the picture on the back
[decks."English RECOGNITION"]
style = "Japanese anime illustration in the style of a light novel cover, 2D cel shading, clean thin lineart, large expressive eyes, soft glowing light, highly detailed digital painting, cinematic golden-hour backlight, glowing rim light on hair, floating light particles, soft bokeh background, rich warm saturated colors, glossy hair highlights, sparkling detailed eyes"
term_field = "Word"
meaning_field = "Meaning"
image_field = "Image"
placement = "append"
card_kind = "auto"

# design/cards/concept: software engineering term; metaphor picture, explanation, code
[decks."SWE::Concepts"]
style = "Japanese anime illustration in the style of a slice-of-life anime, 2D cel shading, clean thin lineart, cozy late-evening workshop or library interior, cool teal monitor glow mixed with warm desk-lamp light, soft bokeh, calm composition, one clear visual metaphor"
term_field = "Term"
meaning_field = "Explanation"
image_field = "Image"
placement = "replace"
card_kind = "concept"
constraints = "NOT Western cartoon, NOT Pixar, NOT 3D render, NOT chibi. No text, no code, no letters, no UI screenshots in the image"

# Card designs for `uv run anki-design sync`: Anki note type name = design in design/cards.
# A note type with several card types names the one to restyle:
#   "English Words" = { design = "recognition", template = "Recognition" }
[note_types]
"English Chunks" = "chunk"
"English Recognition" = "recognition"
"SWE Concept" = "concept"
