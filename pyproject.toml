[project]
name = "anki-imagegen"
version = "0.1.0"
description = "Local MLX image generation for Anki flashcards, exposed as an MCP server"
readme = "README.md"
authors = [
    { name = "kostiantyn", email = "msait17@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio==4.15.1",
    "mcp==2.3.0",
    "mflux==0.21.0",
]

[project.scripts]
anki-imagegen = "anki_imagegen.server:main"
anki-design = "anki_imagegen.design:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: loads the real image model (minutes, GBs of weights)"]
testpaths = ["tests"]
